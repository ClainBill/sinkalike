# Checks the podcast feed every morning. When there's a new episode it commits the updated
# feed.json plus a stub episode file, and Cloudflare rebuilds the site from that commit.
name: Sync episodes from RSS

on:
  schedule:
    - cron: '17 7 * * *' # daily, 07:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/sync-rss.mjs
      - name: Commit new episodes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "sinkalike-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/feed.json src/content/episodes
            git commit -m "Sync episodes from RSS"
            git push
          else
            echo "No new episodes."
          fi
